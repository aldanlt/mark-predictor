server.port=8080

# Conexión a MySQL (los valores llegan como variables de entorno desde docker-compose.yml)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mark_predictor}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:mark}
spring.datasource.password=${DB_PASSWORD:mark}

# Hibernate crea/actualiza las tablas a partir de las entidades (@Entity).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Microservicio Python de predicciones
prediction.service.url=http://${PREDICTION_SERVICE_HOST:localhost}:${PREDICTION_SERVICE_PORT:8000}
